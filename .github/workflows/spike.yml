name: Erisim testi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 10 * * *"
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  ornek:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant: [linux-gorunur, linux-headless, mac-gorunur]
        sample: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.variant == 'mac-gorunur' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Linux, gorunur Chrome
        if: matrix.variant == 'linux-gorunur'
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a -s "-screen 0 1920x1080x24" python -m radar spike --variant linux-gorunur --out spike-out
      - name: Linux, headless Chrome
        if: matrix.variant == 'linux-headless'
        run: python -m radar spike --variant linux-headless --headless --out spike-out
      - name: macOS, gorunur Chrome
        if: matrix.variant == 'mac-gorunur'
        run: python -m radar spike --variant mac-gorunur --out spike-out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spike-${{ matrix.variant }}-${{ matrix.sample }}
          path: spike-out/
          retention-days: 14
          if-no-files-found: ignore

  ozet:
    needs: ornek
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: spike-all
          pattern: spike-*
      - run: python -m radar spike-ozet spike-all
